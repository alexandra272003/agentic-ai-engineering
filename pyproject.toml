[project]
name = "agentic-ai-cohort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexandra272003", email = "alexandraoffical2003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.0.0",
    "groq>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
agentic-ai-cohort = "agentic_ai_cohort:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
